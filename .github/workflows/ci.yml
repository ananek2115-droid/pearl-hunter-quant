name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
      - name: Offline FreeLLMAPI lab smoke test
        run: python -m pearl_hunter_quant.llm_lab --output /tmp/quant_llm_offline.json
